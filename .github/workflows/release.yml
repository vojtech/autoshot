name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Spotless Check
        run: ./gradlew --init-script gradle/init.gradle.kts spotlessCheck

      - name: Publish to Maven Local and Build Plugin
        run: ./gradlew publishToMavenLocal :build-logic:autoshot-plugin:assemble

      - name: Run Build and Tests
        run: ./gradlew check

      - name: Collect Release Artifacts
        run: |
          mkdir release-artifacts
          cp autoshot-annotation/build/libs/*.jar release-artifacts/
          cp autoshot-processor/build/libs/*.jar release-artifacts/
          cp build-logic/autoshot-plugin/build/libs/*.jar release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
